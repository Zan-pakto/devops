# Nagios Service Configuration for DevOps Target Web Server (CampusVoice App)

# 1. ICMP Ping Service Check (Host Vitality)
define service {
    use                     generic-service
    host_name               web-target.devops.lab
    service_description     ICMP Ping
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

# 2. HTTP Port 80 Web Service Check (Web Server Daemon)
define service {
    use                     generic-service
    host_name               web-target.devops.lab
    service_description     HTTP Web Service
    check_command           check_http
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

