# Nagios Custom Commands for Student Complaint System Monitoring

define command {
    command_name    check_app_health
    command_line    /usr/lib/nagios/plugins/check_http -H $HOSTADDRESS$ -p 80 -u /health.php -s "CONNECTED"
}

define command {
    command_name    check_portal_ui
    command_line    /usr/lib/nagios/plugins/check_http -H $HOSTADDRESS$ -p 80 -u /index.php -s "CampusVoice"
}
