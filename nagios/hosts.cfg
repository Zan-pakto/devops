# Nagios Host Configuration for DevOps Target Web Server
define host {
    use                     generic-host
    host_name               web-target.devops.lab
    alias                   Target Web Server (Apache / Ubuntu)
    address                 10.0.1.20
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
}
